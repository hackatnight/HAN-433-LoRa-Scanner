; H@N 433MHz LoRa Module Scanner - CrowPanel 2.4" miner board (SKU DHM04624D).
; Standalone build, separate from the H@N-CYD-GBC emulator firmware.
;
; The release .bin is built in GitHub Actions (.github/workflows/build.yml) and
; dropped into docs/firmware/ for the web flasher - no local toolchain needed.

[env:crowpanel-miner]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.0.0
    lovyan03/LovyanGFX@1.1.16   ; same version as H@N-CYD-GBC, proven on this board
