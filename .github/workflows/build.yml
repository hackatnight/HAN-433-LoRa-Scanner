name: build firmware

# Builds the scanner firmware on GitHub's servers and commits the merged .bin into
# docs/firmware/, where the web flasher picks it up. This is why no local toolchain
# is needed: push a source change, and a minute or two later the flasher is updated.
#
# Same toolchain as H@N-CYD-GBC: arduino-cli with the ESP32 core 2.0.17 and
# LovyanGFX 1.1.16. tools/build.sh does the compile and merge, here and locally.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.ino'
      - 'tools/build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: HAN-433-LoRa-Scanner   # arduino-cli wants the folder named like the .ino

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core, libraries and esptool
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install RadioLib@7.8.1 LovyanGFX@1.1.16 NimBLE-Arduino@1.4.3
          pip install esptool

      - name: Build and merge into one flashable image
        working-directory: HAN-433-LoRa-Scanner
        run: |
          bash tools/build.sh
          LANDSCAPE=1 bash tools/build.sh

      - name: Commit the built firmware
        working-directory: HAN-433-LoRa-Scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/HAN-433-Scanner.bin docs/firmware/HAN-433-Scanner-Landscape.bin
          git commit -m "CI: build scanner firmware [skip ci]" || echo "nothing to commit"
          git push
